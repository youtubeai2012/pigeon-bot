name: Build Android app

on:
  push:
    paths: ["android/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Use preinstalled Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > android/local.properties
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          ls "$SDK/platforms"

      - name: Create signing key (first build only)
        run: |
          if [ ! -f android/keystore/pigeon.jks ]; then
            mkdir -p android/keystore
            keytool -genkeypair -keystore android/keystore/pigeon.jks -alias pigeon \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass pigeonbot -keypass pigeonbot -dname "CN=Pigeon Bot"
            git config user.name "pigeon-bot"
            git config user.email "pigeon-bot@users.noreply.github.com"
            git add android/keystore/pigeon.jks
            git commit -m "Add app signing key"
            git pull --rebase && git push
          fi

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/build/outputs/apk/release/*.apk pigeon.apk
          gh release delete app-latest -y --cleanup-tag || true
          gh release create app-latest pigeon.apk --title "Pigeon Bot app" \
            --notes "Open this page on your phone and tap pigeon.apk to install." --latest