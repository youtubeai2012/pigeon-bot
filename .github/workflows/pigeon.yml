name: Pigeon bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pigeon-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -U -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run pigeon bot
        env:
          TIKTOK_SESSIONID: ${{ secrets.TIKTOK_SESSIONID }}
        run: python pigeon.py

      - name: Save progress
        if: always()
        run: |
          git config user.name "pigeon-bot"
          git config user.email "pigeon-bot@users.noreply.github.com"
          [ -f state/seen.json ] && git add state/seen.json
          [ -f assets/pigeon_cutout.png ] && git add assets/pigeon_cutout.png
          git commit -m "pigeon bot: update state" || echo "nothing to commit"
          git push

      - name: Upload debug screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: work/*.png
          if-no-files-found: ignore