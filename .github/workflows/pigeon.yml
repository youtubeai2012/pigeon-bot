name: Pigeon bot
run-name: ${{ inputs.request_id && format('Pigeon bot {0} {1}', inputs.mode, inputs.request_id) || 'Pigeon bot' }}

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "new = check for new Zack videos, random = make one, check_auth = test TikTok login"
        type: choice
        options: [new, random, check_auth]
        default: new
      post:
        description: "Post to TikTok? (no = just make the video, download it from the run page)"
        type: choice
        options: ["yes", "no"]
        default: "yes"
      request_id:
        description: "Used by the phone app - leave empty"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: pigeon-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Refresh latest code and video history
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
          pip install -U -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run pigeon bot
        env:
          TIKTOK_SESSIONID: ${{ secrets.TIKTOK_SESSIONID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          MODE: ${{ inputs.mode || 'new' }}
          POST: ${{ inputs.post == 'no' && '0' || '1' }}
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" python pigeon.py

      - name: Save progress
        if: always()
        run: python save_progress.py

      - name: Save pigeon video (download from run page / phone app)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pigeon-video
          path: work/pigeon_*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: |
            work/*.png
            work/*.log
            work/youtube_status.json
            work/captions.ass
          retention-days: 7
          if-no-files-found: ignore
