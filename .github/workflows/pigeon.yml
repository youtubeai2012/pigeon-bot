name: Pigeon bot
run-name: ${{ inputs.request_id && format('Pigeon bot {0} {1}', inputs.mode, inputs.request_id) || 'Pigeon bot' }}

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "new = check for new Zach videos, random = make one from a random unused Zach video"
        type: choice
        options: [new, random]
        default: new
      post:
        description: "Post to TikTok? (no = just make the video, download it from the run page)"
        type: choice
        options: ["yes", "no"]
        default: "yes"
      request_id:
        description: "Used by the phone app - leave empty"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: pigeon-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
          pip install -U -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run pigeon bot
        env:
          TIKTOK_SESSIONID: ${{ secrets.TIKTOK_SESSIONID }}
          MODE: ${{ inputs.mode || 'new' }}
          POST: ${{ inputs.post == 'no' && '0' || '1' }}
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" python pigeon.py

      - name: Save progress
        if: always()
        run: |
          git config user.name "pigeon-bot"
          git config user.email "pigeon-bot@users.noreply.github.com"
          [ -f state/seen.json ] && git add state/seen.json
          [ -f state/used.json ] && git add state/used.json
          [ -f state/attempts.json ] && git add state/attempts.json
          [ -f assets/pigeon_cutout.png ] && git add assets/pigeon_cutout.png
          [ -f assets/fonts/Anton-Regular.ttf ] && git add assets/fonts/Anton-Regular.ttf
          git commit -m "pigeon bot: update state" || echo "nothing to commit"
          git pull --rebase || true
          git push

      - name: Save pigeon video (download from run page / phone app)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pigeon-video
          path: work/pigeon_*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: |
            work/*.png
            work/*.log
            work/captions.ass
          retention-days: 7
          if-no-files-found: ignore