name: Pigeon bot

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may start it a few minutes late)
  workflow_dispatch:          # lets you press "Run workflow" manually

permissions:
  contents: write             # needed to save state/seen.json and the pigeon cutout

concurrency:
  group: pigeon-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -U -r requirements.txt

      - name: Run pigeon bot
        env:
          TIKTOK_SESSIONID: ${{ secrets.TIKTOK_SESSIONID }}
        run: python pigeon.py

      - name: Save progress
        if: always()
        run: |
          git config user.name "pigeon-bot"
          git config user.email "pigeon-bot@users.noreply.github.com"
          git add state/seen.json assets/pigeon_cutout.png 2>/dev/null || true
          git commit -m "pigeon bot: update state" || echo "nothing to commit"
          git push
